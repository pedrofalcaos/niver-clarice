<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel da Família 🔒 — Aniversário da Clarice</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; position: relative; z-index: 1; }
    .login-box, .panel { background: var(--cream); border-radius: 24px; padding: 26px 22px;
      box-shadow: var(--shadow); border: 3px dashed var(--bluey); }
    .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .stat { flex: 1; min-width: 130px; background: var(--bluey); color: #fff; border-radius: 16px;
      padding: 16px; text-align: center; box-shadow: 0 6px 0 var(--bluey-dk); }
    .stat .n { font-family: "Baloo 2"; font-weight: 800; font-size: 34px; line-height: 1; }
    .stat .l { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #f0e0e6; font-size: 15px; }
    th { background: var(--bluey-dk); color: #fff; font-weight: 700; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #fff7f3; }
    .del { background: #ffe3e3; color: #c0392b; border: none; border-radius: 8px; padding: 6px 10px;
      cursor: pointer; font-weight: 700; font-family: inherit; }
    .del:hover { background: #ffc9c9; }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
    .tools button, .back { font-family: inherit; font-weight: 600; cursor: pointer;
      border: none; border-radius: 12px; padding: 10px 16px; text-decoration: none;
      background: var(--grass-dk); color: #fff; box-shadow: 0 4px 0 #4e9a4c; }
    .back { background: var(--bluey); box-shadow: 0 4px 0 var(--bluey-dk); }
    .empty { text-align: center; padding: 30px; color: #8a98b8; }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="hills"></div></div>

  <div class="admin-wrap">
    <h1 class="hero-pre" style="text-align:center">🔒 Painel da Família</h1>

    <!-- LOGIN -->
    <section class="login-box" id="loginBox">
      <p style="text-align:center;margin-top:0">Digite a senha para ver as confirmações.</p>
      <form id="loginForm">
        <div class="field">
          <input type="password" id="senha" placeholder=" " required />
          <label for="senha">Senha</label>
        </div>
        <button type="submit" class="btn-confirm"><span class="btn-txt">Entrar</span></button>
        <p class="form-msg err" id="loginMsg"></p>
      </form>
      <p style="text-align:center"><a class="admin-link" href="/">← Voltar ao convite</a></p>
    </section>

    <!-- PAINEL -->
    <section class="panel" id="panel" hidden>
      <div class="stats">
        <div class="stat"><span class="n" id="statTotal">0</span><span class="l">Confirmados</span></div>
      </div>
      <div class="tools">
        <button id="refresh">🔄 Atualizar</button>
        <button id="copy">📋 Copiar lista</button>
        <a class="back" href="/">← Convite</a>
        <button id="logout" style="background:#bbb;box-shadow:0 4px 0 #999">Sair</button>
      </div>
      <div id="tableWrap"></div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
